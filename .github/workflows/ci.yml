name: CI

on:
  pull_request:
    # `edited` is here because a retarget changes what the PR's diff is
    # measured against while the head — and any `lanes` check run already
    # minted on it — stays put, so a base change must start a fresh run.
    # Title and body edits re-run the lane too, deliberately: a skipped
    # job would be worse, because GitHub counts a skipped required check
    # as satisfied, so skipping the lane on a "harmless" edit would let a
    # newer skipped run replace a red verdict on the same head.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # Nothing in this repo dispatches this workflow today; the input exists
  # so `gh workflow run ci.yml -f pr=...` can, naming the PR it reports for.
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number this run reports for.
        required: true
        type: string

# Only the newest run per ref matters; cancel superseded ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The docs lane's classify and lanes steps read the PR's files and commits
  # through the workflow token; read-only, and still nothing here can write.
  pull-requests: read

jobs:
  # Decides whether the build-and-test job may skip: true only when every
  # changed file in the PR is housekeeping (markdown — see
  # .github/lanes.conf for the rule; the engine is mikelward/lanes). Pushes
  # to main are always classified as code, so they run everything.
  classify:
    name: Classify the diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.lane.outputs.docs_only }}
      base_sha: ${{ steps.lane.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        id: lane
        with:
          mode: classify
          pr: ${{ github.event.pull_request.number || inputs.pr }}

  test:
    name: build and test
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    timeout-minutes: 15
    env:
      # Pinned so a CI failure means a real regression, not an upstream bump.
      # Bump these deliberately; JJ_SHA256 must be updated with JJ_VERSION.
      HG_VERSION: 7.2.3
      JJ_VERSION: 0.43.0
      JJ_SHA256: 59e5588583ac82b623239929368c65b90735931c0f26b5a16c1f04d5bb97643d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # vcs-hg's tests exit early when hg is missing, so without this the
      # Mercurial suite would silently pass by not running at all.
      - name: Install Mercurial
        run: |
          pip install "mercurial==${HG_VERSION}"
          hg --version

      # Likewise for vcs-jj: its tests t.Skip when jj isn't on PATH.
      - name: Install Jujutsu
        run: |
          tarball="jj-v${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          url="https://github.com/jj-vcs/jj/releases/download/v${JJ_VERSION}/${tarball}"
          curl --fail --silent --show-error --location -o "$tarball" "$url"
          echo "${JJ_SHA256}  ${tarball}" | sha256sum --check --strict -
          mkdir jj-dist
          tar xzf "$tarball" -C jj-dist
          sudo install -m 755 jj-dist/jj /usr/local/bin/jj
          rm -rf "$tarball" jj-dist
          jj --version

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make

      - name: Test
        run: make test

  # The one check the ruleset should require. Always runs, always reports —
  # green only when the build-and-test job succeeded, or when it was
  # skipped and the skip is INDEPENDENTLY verified as justified: the diff
  # re-derived as housekeeping-only and every commit subject carrying a
  # housekeeping prefix. Any other combination is an explicit red, never a
  # silent pass.
  lanes:
    name: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [classify, test]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: mikelward/lanes@main
        with:
          mode: gate
          pr: ${{ github.event.pull_request.number || inputs.pr }}
          classify-result: ${{ needs.classify.result }}
          # Only read on a dispatched run — the base classify recorded before
          # the heavy job ran; a pull_request run takes the same commit from
          # its own event payload.
          base-sha: ${{ needs.classify.outputs.base_sha }}
          results: >-
            test=${{ needs.test.result }}
